<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjo Nexus - Oportunidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <header class="bg-white border-b shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-700">Anjo<span class="text-gray-700">Nexus</span></h1>
            <div class="text-sm font-medium text-gray-500">
                <i class="fas fa-database mr-1"></i> <span id="total-oportunidades">0</span> Oportunidades disponíveis
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">
        
        <aside class="w-full md:w-64 flex-shrink-0">
            <div class="sticky top-24">
                <h2 class="font-bold text-lg mb-4 flex items-center">
                    <i class="fas fa-filter mr-2 text-blue-600"></i> Filtros
                </h2>
                
                <form id="filter-form" class="space-y-6">
                    <div>
                        <h3 class="font-semibold text-sm uppercase text-gray-500 mb-3 border-b pb-1">Busca</h3>
                        <input type="text" name="search" id="search-input" placeholder="Título ou Objetivo" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm p-2 border">
                    </div>

                    <div>
                        <h3 class="font-semibold text-sm uppercase text-gray-500 mb-3 border-b pb-1">Público Alvo</h3>
                        <div class="space-y-2">
                            <label class="flex items-center text-sm cursor-pointer hover:text-blue-600">
                                <input type="checkbox" name="publico[]" value="Empresa" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> Empresa
                            </label>
                            <label class="flex items-center text-sm cursor-pointer hover:text-blue-600">
                                <input type="checkbox" name="publico[]" value="Startup" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> Startup
                            </label>
                            <label class="flex items-center text-sm cursor-pointer hover:text-blue-600">
                                <input type="checkbox" name="publico[]" value="Cooperativa" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> Cooperativa
                            </label>
                            <label class="flex items-center text-sm cursor-pointer hover:text-blue-600">
                                <input type="checkbox" name="publico[]" value="ICT" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> ICT
                            </label>
                        </div>
                    </div>

                    <div>
                        <h3 class="font-semibold text-sm uppercase text-gray-500 mb-3 border-b pb-1">Órgão / Fonte</h3>
                        <div class="space-y-2">
                            <label class="flex items-center text-sm cursor-pointer hover:text-blue-600">
                                <input type="checkbox" name="fonte[]" value="FINEP" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> FINEP
                            </label>
                            <label class="flex items-center text-sm cursor-pointer hover:text-blue-600">
                                <input type="checkbox" name="fonte[]" value="FAPESC" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> FAPESC
                            </label>
                            <label class="flex items-center text-sm cursor-pointer hover:text-blue-600">
                                <input type="checkbox" name="fonte[]" value="FAPPR" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"> FAPPR
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition shadow-sm">
                        Aplicar Filtros
                    </button>
                </form>
            </div>
        </aside>

        <section class="flex-1">
            <div id="loading" class="hidden text-center py-10">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
                <p class="text-gray-500 mt-4">Carregando editais...</p>
            </div>
            
            <div id="editais-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <!-- Cards will be populated here -->
            </div>

            <div id="pagination" class="mt-12 flex justify-center gap-2">
                <!-- Pagination will be populated here -->
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById('filter-form');
        const grid = document.getElementById('editais-grid');
        const loading = document.getElementById('loading');
        const paginationContainer = document.getElementById('pagination');
        const totalSpan = document.getElementById('total-oportunidades');

        function formatDate(dateString) {
            if (!dateString) return 'Disponível';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR');
        }

        function truncateText(text, length) {
            if (!text) return 'Objetivo completo disponível no link oficial.';
            return text.length > length ? text.substring(0, length) + '...' : text;
        }

        function getCardBorder(fonte) {
            if (fonte === 'FAPESC') return 'border-sky-500';
            if (fonte === 'FAPPR') return 'border-emerald-600';
            return 'border-blue-600';
        }

        function getBadgeClass(fonte) {
            if (fonte === 'FAPESC') return 'bg-sky-50 text-sky-700';
            if (fonte === 'FAPPR') return 'bg-emerald-50 text-emerald-700';
            return 'bg-blue-50 text-blue-700';
        }

        async function fetchEditais(url = '/api/editais') {
            grid.innerHTML = '';
            paginationContainer.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                loading.classList.add('hidden');

                if (data.success && data.data && data.data.data) {
                    const editais = data.data.data;
                    totalSpan.textContent = data.data.total;
                    
                    if (editais.length === 0) {
                        grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">Nenhum edital encontrado com os filtros atuais.</p>';
                    }

                    editais.forEach(edital => {
                        const card = document.createElement('div');
                        card.className = `bg-white rounded-xl shadow-sm border-t-4 ${getCardBorder(edital.fonte)} p-6 flex flex-col justify-between hover:shadow-md transition`;
                        
                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                  <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md ${getBadgeClass(edital.fonte)}">
                                    ${edital.fonte}
                                  </span>
                                    <span class="text-xs text-gray-400">
                                        <i class="far fa-calendar-alt mr-1"></i> 
                                        ${formatDate(edital.data_publicacao)}
                                    </span>
                                </div>

                                <h3 class="text-base font-bold text-gray-800 mb-3 line-clamp-2 leading-tight min-h-[3rem]">
                                    ${edital.titulo}
                                </h3>

                                <div class="space-y-3 flex-1">
                                    <p class="text-sm text-gray-600">
                                        <span class="font-bold text-gray-800">Objetivo:</span> 
                                        ${truncateText(edital.objetivo, 150)}
                                    </p>
                                    <p class="text-sm text-gray-600">
                                        <span class="font-bold text-blue-600">Público:</span> 
                                        ${edital.publico ? edital.publico : 'Verificar elegibilidade no edital'}
                                    </p>
                                </div>
                            </div>

                            <div class="mt-6 pt-4 border-t border-gray-100 flex justify-between items-center gap-2">
                                <div class="flex items-center gap-4">
                                    <a href="/editais/show?id=${edital.id}" class="text-blue-600 text-sm font-bold hover:text-blue-800 transition flex items-center gap-1">
                                        <i class="fas fa-info-circle text-xs"></i> Ver Detalhes
                                    </a>

                                    <a href="${edital.link}" target="_blank" class="text-gray-500 hover:text-gray-700 text-sm font-medium transition flex items-center gap-1 border-l pl-4 border-gray-200">
                                        Link Oficial <i class="fas fa-external-link-alt text-[10px]"></i>
                                    </a>
                                </div>

                                <button class="text-gray-300 hover:text-yellow-500 transition flex-shrink-0">
                                    <i class="fas fa-star"></i>
                                </button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    // Pagination
                    const meta = data.data;
                    if (meta.links && meta.links.length > 3) {
                        meta.links.forEach(link => {
                            const btn = document.createElement('button');
                            btn.innerHTML = link.label; // Can contain &laquo; and &raquo;
                            btn.className = `px-4 py-2 border rounded ${link.active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-blue-600 hover:bg-blue-50'} ${!link.url ? 'opacity-50 cursor-not-allowed' : ''}`;
                            if (link.url) {
                                btn.onclick = () => fetchEditais(link.url);
                            }
                            paginationContainer.appendChild(btn);
                        });
                    }
                } else {
                    grid.innerHTML = '<p class="text-red-500 col-span-full text-center">Erro ao carregar editais.</p>';
                }
            } catch (err) {
                loading.classList.add('hidden');
                grid.innerHTML = '<p class="text-red-500 col-span-full text-center">Erro de conexão com a API.</p>';
                console.error(err);
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const params = new URLSearchParams();
            
            for (const [key, value] of formData.entries()) {
                if (value) {
                    params.append(key, value);
                }
            }
            
            fetchEditais(`/api/editais?${params.toString()}`);
        });

        // Parse initial URL params to check checkboxes
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const searchInput = document.getElementById('search-input');
            if (params.has('search')) searchInput.value = params.get('search');
            
            ['publico[]', 'fonte[]'].forEach(name => {
                const values = params.getAll(name);
                if (values.length > 0) {
                    const checkboxes = document.querySelectorAll(`input[name="${name}"]`);
                    checkboxes.forEach(cb => {
                        if (values.includes(cb.value)) {
                            cb.checked = true;
                        }
                    });
                }
            });

            // Make initial fetch with params if any
            fetchEditais(`/api/editais?${params.toString()}`);
        });

    </script>
</body>
</html>
